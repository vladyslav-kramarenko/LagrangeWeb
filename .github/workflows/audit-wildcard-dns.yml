name: Read-only DNS wildcard and legacy host audit
on:
  push:
    branches:
      - audit/dns-wildcard-20261126
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: DNS, HTTPS and historical path checks (no mutations)
        shell: bash
        run: |
          set -u
          echo '====== AUTHORITATIVE DNS ======'
          dig +time=3 +tries=1 +short NS kramarenko.info || true
          echo '====== HOST RESOLUTION ======'
          hosts=(
            kramarenko.info
            www.kramarenko.info
            old.kramarenko.info
            lagrange.kramarenko.info
            dev.kramarenko.info
            numerical.kramarenko.info
            leo-racer.kramarenko.info
            dev.leo-racer.kramarenko.info
            piano.kramarenko.info
            mail.kramarenko.info
            random-audit-20261126-xy92.kramarenko.info
            random-two-level-xy92.foo.kramarenko.info
          )
          for host in "${hosts[@]}"; do
            echo "=== HOST $host ==="
            for rr in A AAAA CNAME; do
              answer="$(dig +time=3 +tries=1 +short "$rr" "$host" | tr '\n' ',' | sed 's/,$//')"
              echo "DNS $rr: ${answer:-none}"
            done
            answer="$(curl -sSIL --max-time 10 --max-redirs 3 -o /dev/null -w 'status:%{http_code} final:%{url_effective} remote:%{remote_ip} tls:%{ssl_verify_result}' "https://$host/" 2>/dev/null || true)"
            echo "HTTPS ${answer:-unreachable}"
          done
          echo '====== LEGACY PATH VERIFICATION ======'
          paths=(
            /assets/documents/2024_DEV_Kramarenko_Vladyslav.pdf
            /assets/documents/2024_Java_SD_Kramarenko_Vladyslav.pdf
            /img/certificates/bachelor_diploma.pdf
            /img/certificates/masters_diploma.jpg
            /img/portfolio/scratching_post.skp
            /portfolio/Just-Cat
            /portfolio/ecofuel-plus
            /home
          )
          for host in kramarenko.info www.kramarenko.info old.kramarenko.info; do
            for path in "${paths[@]}"; do
              answer="$(curl -sS --max-time 12 -o /dev/null -w '%{http_code} %{content_type} %{redirect_url}' "https://$host$path" 2>/dev/null || true)"
              echo "$host$path => ${answer:-unreachable}"
            done
          done
          echo '====== RANDOM HOST RESPONSE HEADERS ======'
          for host in old.kramarenko.info random-audit-20261126-xy92.kramarenko.info; do
            echo "=== $host ==="
            curl -sSI --max-time 12 "https://$host/" 2>/dev/null | grep -Ei '^(HTTP/|server:|location:|content-type:|x-robots-tag:|cf-ray:|cache-control:)' | head -16 || true
          done

      - name: Identify the page behind the wildcard and inspect SEO directives
        shell: bash
        run: |
          python3 - <<'PY'
          import urllib.request, re, hashlib, html
          hosts = [
              'kramarenko.info',
              'www.kramarenko.info',
              'old.kramarenko.info',
              'lagrange.kramarenko.info',
              'dev.kramarenko.info',
              'numerical.kramarenko.info',
              'leo-racer.kramarenko.info',
              'dev.leo-racer.kramarenko.info',
              'piano.kramarenko.info',
              'mail.kramarenko.info',
              'random-audit-20261126-xy92.kramarenko.info'
          ]
          print('====== HTML IDENTITY AND ROBOTS ======', flush=True)
          for host in hosts:
              url = 'https://' + host + '/'
              try:
                  req=urllib.request.Request(url, headers={'User-Agent':'Mozilla/5.0 DNS-Audit-ReadOnly'})
                  with urllib.request.urlopen(req,timeout=12) as response:
                      body=response.read(400000).decode('utf-8','replace')
                      title=re.search(r'<title[^>]*>(.*?)</title>', body, re.I|re.S)
                      canonical=re.search(r'<link[^>]+rel=["\']canonical["\'][^>]+href=["\']([^"\']+)', body, re.I)
                      robots=re.search(r'<meta[^>]+name=["\']robots["\'][^>]+content=["\']([^"\']+)', body, re.I)
                      def clean(v): return re.sub(r'\s+',' ',html.unescape(v or ''))[:130]
                      print('HTML',host,'status',response.status,'sha256',hashlib.sha256(body.encode()).hexdigest()[:18],
                            'title',clean(title.group(1) if title else None),
                            'canonical',clean(canonical.group(1) if canonical else None),
                            'robots',clean(robots.group(1) if robots else None),
                            'header-x-robots',response.headers.get('x-robots-tag'),
                            'final',response.url,flush=True)
              except Exception as e:
                  print('HTML',host,'ERROR',type(e).__name__,str(e)[:150],flush=True)
          PY

      - name: Passive subdomain history (CT, URLScan, AlienVault, Google-indexable candidates)
        shell: bash
        run: |
          python3 - <<'PY'
          import json, urllib.request, urllib.parse, collections, re
          from urllib.error import HTTPError
          domain="kramarenko.info"
          sources={
              'crt.sh (Certificate Transparency)':"https://crt.sh/?q=%25.kramarenko.info&output=json",
              'Cert Spotter (unexpired)':"https://api.certspotter.com/v1/issuances?domain=kramarenko.info&include_subdomains=true&expand=dns_names",
              'AlienVault passive DNS':"https://otx.alienvault.com/api/v1/indicators/domain/kramarenko.info/passive_dns",
              'urlscan public':"https://urlscan.io/api/v1/search/?q=domain%3Akramarenko.info&size=100"
          }
          results=collections.defaultdict(set)
          for label,url in sources.items():
              try:
                  request=urllib.request.Request(url, headers={"User-Agent":"Mozilla/5.0 (Authorized-Inventory; read-only)", "Accept":"application/json"})
                  with urllib.request.urlopen(request,timeout=18) as r:
                      payload=r.read(6_000_000)
                      data=json.loads(payload)
                  names=set()
                  if "crt.sh" in label:
                      for entry in data:
                          names.update(entry.get("name_value","").splitlines())
                          names.add(entry.get("common_name",""))
                  elif "Cert Spotter" in label:
                      for entry in data:
                          names.update(entry.get("dns_names",[]))
                  elif "AlienVault" in label:
                      for entry in data.get("passive_dns",[]):
                          names.add(entry.get("hostname",""))
                      print("ALIENVAULT RECORD COUNT:",len(data.get("passive_dns",[])))
                  else:
                      for entry in data.get("results",[]):
                          page=entry.get("page",{}) or {}
                          task=entry.get("task",{}) or {}
                          names.add(page.get("domain",""))
                          names.add(task.get("domain",""))
                          names.add(task.get("url","").split("://")[-1].split("/")[0])
                  unique=sorted({str(x).strip().lower().rstrip(".") for x in names if str(x).strip().lower().rstrip(".").endswith(domain)})
                  results[label].update(unique)
                  print("SOURCE",label,"COUNT",len(unique))
                  for n in unique: print("FOUND",label,"HOST",n)
              except Exception as e:
                  print("SOURCE",label,"ERROR",type(e).__name__,str(e)[:200])
          print("====== ALL HISTORICAL/OBSERVED LABELS ======")
          union=sorted(set().union(*results.values()))
          for host in union:
              in_sources=[label for label,items in results.items() if host in items]
              print("CANDIDATE",host,"SOURCES",",".join(in_sources))
          print("UNIQUE CANDIDATES:",len(union))
          PY
