name: Verify production release

on:
  push:
    branches: [production]
  pull_request:
    branches: [production]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify production Worker identity
        run: |
          node - <<'NODE'
          const fs = require('node:fs');
          const assert = require('node:assert/strict');
          const config = JSON.parse(fs.readFileSync('wrangler.jsonc', 'utf8'));
          assert.equal(config.name, 'lagrangeweb', 'Incorrect production Worker name');
          assert.equal(config.assets.directory, './');
          assert.equal(config.workers_dev, true, 'Keep temporary worker URL available until cutover');
          const headers = fs.readFileSync('_headers', 'utf8');
          assert.ok(headers.includes('https://lagrangeweb.kramarenko-vladyslav-92.workers.dev/*'));
          assert.ok(headers.includes('X-Robots-Tag: noindex'));
          assert.ok(!headers.includes('https://lagrange.kramarenko.info/*'), 'Do not accidentally block production indexing');
          const home = fs.readFileSync('index.html', 'utf8');
          const guide = fs.readFileSync('guide/index.html', 'utf8');
          const result = fs.readFileSync('result/index.html', 'utf8');
          assert.ok(home.includes('rel="canonical" href="https://lagrange.kramarenko.info/"'));
          assert.ok(guide.includes('rel="canonical" href="https://lagrange.kramarenko.info/guide/"'));
          assert.ok(result.includes('name="robots" content="noindex,follow"'));
          const sitemap = fs.readFileSync('sitemap.xml', 'utf8');
          assert.ok(!sitemap.includes('/result/'));
          console.log('Production config, indexation, and canonical checks passed');
          NODE
      - name: Check JavaScript syntax
        shell: bash
        run: |
          for file in js/*.js; do
            node --check "$file"
          done
      - name: Verify static pages and dependencies
        shell: bash
        run: |
          test -s index.html
          test -s guide/index.html
          test -s result/index.html
          test -s css/style.css
          test -s css/theme.css
          test -s css/app-extras.css
          test -s assets/vk-mark.svg

  smoke-http:
    name: Public Worker HTTP & SEO smoke test
    runs-on: ubuntu-latest
    needs: verify
    steps:
      - name: Verify Worker static pages, assets, and noindex headers
        shell: bash
        env:
          SITE: https://lagrangeweb.kramarenko-vladyslav-92.workers.dev
        run: |
          set -euo pipefail
          tmp="$(mktemp -d)"
          trap 'rm -rf "$tmp"' EXIT
          # Cloudflare builds may finish after GitHub Actions starts: check the
          # deployed source marker rather than testing an older release.
          current=0
          for attempt in $(seq 1 24); do
            if curl -fsSL --connect-timeout 10 --max-time 20 "$SITE/js/chart.js?check=$attempt" | grep -q 'function redrawLagrangeChart()'; then
              current=1
              break
            fi
            echo "Waiting for updated Cloudflare release ($attempt/24)"
            sleep 5
          done
          test "$current" -eq 1 || { echo 'ERROR: Cloudflare is still serving the previous release'; exit 1; }
          fetch() {
            local path="$1" output="$2" headers="$3"
            curl --fail --silent --show-error --location \
              --retry 8 --retry-delay 3 --retry-all-errors \
              --connect-timeout 15 --max-time 45 \
              -A 'Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/126.0 Safari/537.36' \
              --dump-header "$headers" --output "$output" "$SITE$path"
          }
          fetch '/' "$tmp/home" "$tmp/home.headers"
          fetch '/guide/' "$tmp/guide" "$tmp/guide.headers"
          fetch '/result/?p=%5B%5B1%2C2%5D%2C%5B2%2C5%5D%2C%5B3%2C10%5D%5D' "$tmp/result" "$tmp/result.headers"
          fetch '/js/main.js' "$tmp/main.js" "$tmp/asset.headers"
          fetch '/css/style.css' "$tmp/style.css" "$tmp/css.headers"
          fetch '/robots.txt' "$tmp/robots.txt" "$tmp/robots.headers"
          fetch '/sitemap.xml' "$tmp/sitemap.xml" "$tmp/sitemap.headers"
          grep -q 'Lagrange interpolation calculator' "$tmp/home"
          grep -q 'rel="canonical" href="https://lagrange.kramarenko.info/"' "$tmp/home"
          grep -q 'How Lagrange polynomial interpolation works' "$tmp/guide"
          grep -q 'rel="canonical" href="https://lagrange.kramarenko.info/guide/"' "$tmp/guide"
          grep -q 'name="robots" content="noindex,follow"' "$tmp/result"
          grep -q 'function simplifyPolynomial()' "$tmp/main.js"
          grep -q 'https://lagrange.kramarenko.info/sitemap.xml' "$tmp/robots.txt"
          grep -q 'https://lagrange.kramarenko.info/guide/' "$tmp/sitemap.xml"
          for file in home.headers guide.headers result.headers; do
            grep -qi '^x-robots-tag:.*noindex' "$tmp/$file" || { echo "Missing noindex for $file"; cat "$tmp/$file"; exit 1; }
          done
          echo "Worker HTTP, static asset, canonical and preview noindex checks passed."


  live-domain:
    name: Live custom-domain HTTP, HTTPS & SEO test
    runs-on: ubuntu-latest
    needs: verify
    steps:
      - name: Audit canonical production domain
        shell: bash
        env:
          SITE: https://lagrange.kramarenko.info
          HOST: lagrange.kramarenko.info
        run: |
          set -euo pipefail
          echo "DNS resolution:"
          getent ahostsv4 "$HOST" | head -8 || true
          tmp="$(mktemp -d)"
          trap 'rm -rf "$tmp"' EXIT
          # Cloudflare builds may finish after GitHub Actions starts: check the
          # deployed source marker rather than testing an older release.
          current=0
          for attempt in $(seq 1 24); do
            if curl -fsSL --connect-timeout 10 --max-time 20 "$SITE/js/chart.js?check=$attempt" | grep -q 'function redrawLagrangeChart()'; then
              current=1
              break
            fi
            echo "Waiting for updated Cloudflare release ($attempt/24)"
            sleep 5
          done
          test "$current" -eq 1 || { echo 'ERROR: Cloudflare is still serving the previous release'; exit 1; }
          fetch() {
            local path="$1" name="$2"
            curl --fail --silent --show-error --location --retry 3 --retry-delay 2 \
              --connect-timeout 15 --max-time 40 \
              --dump-header "$tmp/$name.headers" --output "$tmp/$name" "$SITE$path"
            echo "Received $path:"
            grep -Ei '^(HTTP/|content-type:|x-robots-tag:|location:|strict-transport-security:)' "$tmp/$name.headers" || true
          }
          fetch '/' home
          fetch '/guide/' guide
          fetch '/result/?p=%5B%5B1%2C2%5D%2C%5B2%2C5%5D%2C%5B3%2C10%5D%5D' result
          fetch '/robots.txt' robots
          fetch '/sitemap.xml' sitemap
          fetch '/assets/vk-mark.svg' logo
          fetch '/js/main.js' main
          fetch '/js/theme.js?v=20261123-2' theme
          fetch '/js/i18n.js' i18n
          fetch '/js/result.js' resultjs
          fetch '/css/app-extras.css' css
          grep -q 'Lagrange interpolation calculator' "$tmp/home"
          grep -q 'rel="canonical" href="https://lagrange.kramarenko.info/"' "$tmp/home"
          grep -q 'How Lagrange polynomial interpolation works' "$tmp/guide"
          grep -q 'rel="canonical" href="https://lagrange.kramarenko.info/guide/"' "$tmp/guide"
          grep -q 'name="robots" content="noindex,follow"' "$tmp/result"
          grep -q 'function simplifyPolynomial()' "$tmp/main"
          grep -q 'function applyTheme(' "$tmp/theme"
          grep -q 'function initialLanguage()' "$tmp/i18n"
          grep -q 'lagrange.kramarenko.info' "$tmp/sitemap"
          grep -q '/guide/' "$tmp/sitemap"
          grep -q 'Sitemap: https://lagrange.kramarenko.info/sitemap.xml' "$tmp/robots"
          if grep -Eqi '(^x-robots-tag:.*noindex|<meta[^>]*name="robots"[^>]*noindex)' "$tmp/home.headers" "$tmp/home" "$tmp/guide.headers" "$tmp/guide"; then
            echo 'ERROR: Public home or guide is noindexed'
            exit 1
          fi
          if grep -Eqi '^x-robots-tag:.*noindex' "$tmp/result.headers"; then
            echo 'NOTE: Result page also protected by X-Robots-Tag'
          fi
          # Diagnose (and require) HTTP redirect to HTTPS; not just a successful HTTPS response.
          redirect_status="$(curl -sS -o /dev/null -w '%{http_code}' --max-time 25 "http://$HOST/" || true)"
          redirect_url="$(curl -sS -o /dev/null -w '%{redirect_url}' --max-time 25 "http://$HOST/" || true)"
          echo "HTTP redirect: status=$redirect_status location=$redirect_url"
          if [[ ! "$redirect_status" =~ ^(301|302|307|308)$ ]] || [[ "$redirect_url" != https://* ]]; then
            echo "ERROR: HTTP does not redirect to HTTPS"
            exit 1
          fi
          echo 'PASS: Live production custom domain, canonical, indexing, static assets and HTTPS redirect.'

  browser-e2e:
    name: Mobile browser functional test
    runs-on: ubuntu-latest
    needs: [smoke-http, live-domain]
    container:
      image: mcr.microsoft.com/playwright:v1.56.1-noble
    steps:
      - uses: actions/checkout@v4
      - name: Install matching Playwright runtime
        run: npm install --no-save playwright@1.56.1
      - name: Exercise Worker calculator and exports
        env:
          SITE: https://lagrangeweb.kramarenko-vladyslav-92.workers.dev
        run: node tests/smoke-browser.cjs
      - name: Exercise canonical production domain in mobile browser
        env:
          SITE: https://lagrange.kramarenko.info
        run: node tests/smoke-browser.cjs
